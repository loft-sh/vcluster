{{- $exports := list (dict "name" (printf "vc-%s" .Release.Name) "namespace" .Release.Namespace "serviceAccount" .Values.exportKubeConfig.serviceAccount) }}
{{- $legacy := .Values.exportKubeConfig.secret }}
{{- if or $legacy.name $legacy.namespace }}
{{- $exports = append $exports (dict "name" $legacy.name "namespace" $legacy.namespace "serviceAccount" .Values.exportKubeConfig.serviceAccount) }}
{{- else }}
{{- $exports = concat $exports (default list .Values.exportKubeConfig.additionalSecrets) }}
{{- end }}
{{- range $secret := $exports }}
{{- $serviceAccount := default dict $secret.serviceAccount }}
{{- if $serviceAccount.tokenRotation }}
{{- $name := default (printf "vc-%s" $.Release.Name) $secret.name }}
{{- $namespace := default $.Release.Namespace $secret.namespace }}
{{- $prefix := printf "vc-%s-v-%s-export" $.Release.Name $.Release.Namespace | trunc 50 | trimSuffix "-" }}
{{- $rbacName := printf "%s-%s" $prefix (printf "%s/%s/%s/%s" $.Release.Namespace $.Release.Name $namespace $name | sha256sum | trunc 10) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
{{ toYaml (merge (dict "app" "vcluster" "vcluster-name" $.Release.Name) (default dict $secret.labels)) | indent 4 }}
type: Opaque
{{/* Leave data unmanaged so Helm upgrades preserve credentials written by vCluster. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $rbacName | quote }}
  namespace: {{ $namespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $rbacName | quote }}
  namespace: {{ $namespace | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ default (printf "vc-%s" $.Release.Name) $.Values.controlPlane.advanced.serviceAccount.name | quote }}
    namespace: {{ $.Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $rbacName | quote }}
{{- end }}
{{- end }}
