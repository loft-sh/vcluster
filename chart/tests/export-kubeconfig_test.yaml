suite: Kubeconfig export destinations
templates:
  - export-kubeconfig.yaml
tests:

  - it: does not provision destinations by default
    asserts:
      - hasDocuments:
          count: 0

  - it: preserves legacy runtime-managed destinations
    set:
      exportKubeConfig.additionalSecrets:
        - name: credentials
          namespace: controllers
          serviceAccount:
            name: runtime
    asserts:
      - hasDocuments:
          count: 0

  - it: does not provision destinations for empty rotation blocks
    set:
      exportKubeConfig.serviceAccount.tokenRotation: {}
      exportKubeConfig.additionalSecrets:
        - name: credentials
          serviceAccount:
            name: runtime
            tokenRotation: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: provisions an empty Secret and scoped RBAC from the rotation block alone
    release:
      namespace: tenant
    set:
      exportKubeConfig.additionalSecrets:
        - name: credentials
          namespace: controllers
          serviceAccount:
            name: runtime
            tokenRotation:
              expiration: 10m
          labels:
            example.com/cluster: tenant
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: credentials
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: controllers
        documentIndex: 0
      - equal:
          path: metadata.labels["example.com/cluster"]
          value: tenant
        documentIndex: 0
      - notExists:
          path: data
        documentIndex: 0
      - notExists:
          path: stringData
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups:
                - ''
              resources:
                - secrets
              resourceNames:
                - credentials
              verbs:
                - get
                - list
                - watch
                - patch
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: controllers
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: vc-RELEASE-NAME
              namespace: tenant
        documentIndex: 2
      - equal:
          path: roleRef.kind
          value: Role
        documentIndex: 2

  - it: binds the configured host ServiceAccount
    release:
      namespace: tenant
    set:
      controlPlane.advanced.serviceAccount.name: custom-writer
      exportKubeConfig.additionalSecrets:
        - name: credentials
          namespace: controllers
          serviceAccount:
            name: runtime
            tokenRotation:
              expiration: 10m
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: subjects[0].name
          value: custom-writer
        documentIndex: 2

  - it: provisions the default export when its rotation block is configured
    release:
      name: tenant-example
      namespace: tenant-host
    set:
      exportKubeConfig.serviceAccount:
        name: runtime
        tokenRotation:
          expiration: 10m
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: vc-tenant-example
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: tenant-host
        documentIndex: 0
      - equal:
          path: rules[0].resourceNames
          value:
            - vc-tenant-example
        documentIndex: 1

  - it: resolves omitted destination names and namespaces
    release:
      namespace: tenant
    set:
      exportKubeConfig.additionalSecrets:
        - name: credentials
          serviceAccount:
            name: runtime
            tokenRotation:
              expiration: 10m
        - namespace: controllers
          serviceAccount:
            name: runtime
            tokenRotation:
              expiration: 10m
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.namespace
          value: tenant
        documentIndex: 0
      - equal:
          path: rules[0].resourceNames
          value:
            - vc-RELEASE-NAME
        documentIndex: 4

  - it: provisions both default and deprecated additional exports with inherited rotation
    release:
      name: tenant-example
      namespace: tenant-host
    set:
      exportKubeConfig.serviceAccount:
        name: runtime
        tokenRotation:
          expiration: 10m
      exportKubeConfig.secret:
        name: old-export
        namespace: controllers
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.name
          value: vc-tenant-example
        documentIndex: 0
      - equal:
          path: metadata.name
          value: old-export
        documentIndex: 3
      - equal:
          path: metadata.namespace
          value: controllers
        documentIndex: 3

  - it: leaves legacy destinations unprovisioned alongside rotating destinations
    set:
      exportKubeConfig.additionalSecrets:
        - name: credentials
          namespace: controllers
          serviceAccount:
            name: runtime
            tokenRotation:
              expiration: 10m
        - name: legacy
          namespace: controllers
          serviceAccount:
            name: legacy
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: credentials
        documentIndex: 0

  - it: produces distinct RBAC names even for long release names
    release:
      name: tenant-with-a-long-release-name-for-export-dests
      namespace: tenant-with-a-long-namespace-name
    set:
      exportKubeConfig.additionalSecrets:
        - name: first
          namespace: controllers
          serviceAccount:
            name: runtime
            tokenRotation:
              expiration: 10m
        - name: second
          namespace: controllers
          serviceAccount:
            name: runtime
            tokenRotation:
              expiration: 10m
    asserts:
      - hasDocuments:
          count: 6
      - matchRegex:
          path: metadata.name
          pattern: ^.{1,50}-1f810a9e77$
        documentIndex: 1
      - matchRegex:
          path: metadata.name
          pattern: ^.{1,50}-76c3dd6293$
        documentIndex: 4
