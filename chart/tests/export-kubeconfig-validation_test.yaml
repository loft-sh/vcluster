suite: Kubeconfig export token validation
templates:
  - statefulset.yaml
tests:

  - it: preserves default certificate exports
    asserts:
      - isKind:
          of: StatefulSet

  - it: preserves named ServiceAccount exports without rotation
    set:
      exportKubeConfig.serviceAccount:
        name: runtime
    asserts:
      - isKind:
          of: StatefulSet

  - it: accepts an empty rotation block without a named ServiceAccount
    set:
      exportKubeConfig.serviceAccount.tokenRotation: {}
    asserts:
      - isKind:
          of: StatefulSet

  - it: rejects a percentage without an expiration
    set:
      exportKubeConfig.serviceAccount:
        name: runtime
        tokenRotation:
          renewBeforePercentage: 33
    asserts:
      - failedTemplate:
          errorMessage: exportKubeConfig.serviceAccount.tokenRotation.expiration is required when rotation settings are configured

  - it: rejects an additional percentage without an expiration
    set:
      exportKubeConfig.additionalSecrets:
        - name: credentials
          serviceAccount:
            name: runtime
            tokenRotation:
              renewBeforePercentage: 33
    asserts:
      - failedTemplate:
          errorMessage: exportKubeConfig.additionalSecrets[0].serviceAccount.tokenRotation.expiration is required when rotation settings are configured

  - it: accepts the minimum token lifetime and renewal percentage
    set:
      exportKubeConfig.serviceAccount:
        name: runtime
        tokenRotation:
          expiration: 10m
          renewBeforePercentage: 1
    asserts:
      - isKind:
          of: StatefulSet

  - it: accepts the API maximum token lifetime and renewal percentage
    set:
      exportKubeConfig.serviceAccount:
        name: runtime
        tokenRotation:
          expiration: 4294967296s
          renewBeforePercentage: 99
    asserts:
      - isKind:
          of: StatefulSet

  - it: accepts an additional renewable export without provisioning flags
    set:
      exportKubeConfig.additionalSecrets:
        - name: credentials
          namespace: controllers
          serviceAccount:
            name: runtime
            tokenRotation:
              expiration: 10m
    asserts:
      - isKind:
          of: StatefulSet

  - it: rejects default token rotation without a named ServiceAccount
    set:
      exportKubeConfig.serviceAccount.tokenRotation:
        expiration: 10m
    asserts:
      - failedTemplate:
          errorMessage: exportKubeConfig.serviceAccount.tokenRotation requires a named ServiceAccount

  - it: rejects additional token rotation without a named ServiceAccount
    set:
      exportKubeConfig.additionalSecrets:
        - name: credentials
          serviceAccount:
            tokenRotation:
              expiration: 10m
    asserts:
      - failedTemplate:
          errorMessage: exportKubeConfig.additionalSecrets[0].serviceAccount.tokenRotation requires a named ServiceAccount
