name: Workflow Linting

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/tests/test-pr-event-workflows.py"

permissions: {}

jobs:
  actionlint:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: loft-sh/github-actions/.github/workflows/actionlint.yaml@actionlint/v1
    with:
      reporter: github-pr-check

  workflow-security-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.1
      - name: Test PR workflow trust boundaries
        run: python3 .github/tests/test-pr-event-workflows.py
