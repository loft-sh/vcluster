name: Pull request events

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- metadata only; no checkout, business secrets, or write token
    types: [labeled, closed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record event
        run: >-
          jq '{number,action,label: (if .action == "labeled" then .label.name else "" end)}' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/event.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pull-request-event-${{ github.run_attempt }}
          path: ${{ runner.temp }}/event.json
          retention-days: 1
          if-no-files-found: error
